<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="100%" height="100%">
  <!-- Main brand group -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-weight="900" font-size="58" fill="#163984">
    <!-- citi -->
    <text x="10" y="70" letter-spacing="-1">citi</text>
    <!-- z -->
    <text x="122" y="70">z</text>
    <!-- en -->
    <text x="162" y="70" letter-spacing="-1">en</text>
  </g>

  <!-- Orange/Yellow Lightning Bolt through the 'z' -->
  <polygon points="144,25 127,66 141,66 125,106 156,58 141,58" fill="#FF8A00" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>

  <!-- TM Symbol -->
  <text x="240" y="32" fill="#163984" font-family="'Inter', sans-serif" font-size="14" font-weight="800">TM</text>

  <!-- "SOLAR" wordmark in bright orange -->
  <text x="145" y="130" text-anchor="middle" fill="#FF7000" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-weight="900" font-size="38" letter-spacing="4">SOLAR</text>
</svg>
