<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="100%" height="100%">
  <!-- "citizen" Wordmark in Dark Navy -->
  <g font-family="'Inter', 'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="54" fill="#1C3F94">
    <!-- c, i, t, i -->
    <text x="15" y="60">citi</text>
    <!-- z with lightning bolt cutout -->
    <text x="110" y="60">z</text>
    <!-- en -->
    <text x="155" y="60">en</text>
  </g>

  <!-- Orange Lightning Bolt across the 'z' -->
  <polygon points="128,25 116,55 125,55 112,80 135,46 124,46" fill="#F88200" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Registered TM -->
  <text x="228" y="24" fill="#1C3F94" font-family="sans-serif" font-size="10" font-weight="bold">TM</text>

  <!-- "SOLAR" Subtitle in Orange -->
  <text x="220" y="105" text-anchor="end" fill="#F88200" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="2">SOLAR</text>
</svg>
