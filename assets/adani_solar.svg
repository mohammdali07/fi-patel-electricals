<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="100%" height="100%">
  <defs>
    <!-- Adani Multi-color Gradient -->
    <linearGradient id="adaniGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006BB6"/>
      <stop offset="35%" stop-color="#4B51A3"/>
      <stop offset="70%" stop-color="#802B8F"/>
      <stop offset="100%" stop-color="#C22055"/>
    </linearGradient>
  </defs>

  <!-- "adani" Wordmark -->
  <text x="150" y="65" text-anchor="middle" fill="url(#adaniGrad)" font-family="'Inter', 'Quicksand', 'Comfortaa', sans-serif" font-weight="800" font-size="64" letter-spacing="-1.5">adani</text>

  <!-- Horizontal Divider Line -->
  <line x1="60" y1="82" x2="240" y2="82" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "Solar" Subtitle -->
  <text x="150" y="112" text-anchor="middle" fill="#444444" font-family="'Inter', 'Arial', sans-serif" font-weight="600" font-size="28" letter-spacing="0.5">Solar</text>
</svg>
