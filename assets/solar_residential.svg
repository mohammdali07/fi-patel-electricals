<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="680" cy="90" r="55" fill="url(#sunGlow)" opacity="0.95"/>
  <circle cx="680" cy="90" r="75" fill="#fde047" opacity="0.25"/>

  <!-- House Roof Base -->
  <polygon points="60,320 400,160 740,320" fill="#cbd5e1"/>
  <polygon points="40,320 400,150 760,320" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <rect x="100" y="320" width="600" height="180" fill="#e2e8f0"/>

  <!-- Residential Solar Panel Mounting Frame -->
  <g id="solarGrid">
    <!-- Panel 1 -->
    <polygon points="140,290 320,210 330,270 150,350" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Grid Lines 1 -->
    <line x1="230" y1="250" x2="240" y2="310" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="185" y1="270" x2="275" y2="230" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="205" y1="310" x2="295" y2="270" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

    <!-- Panel 2 -->
    <polygon points="340,200 520,120 530,180 350,260" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Grid Lines 2 -->
    <line x1="430" y1="160" x2="440" y2="220" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="385" y1="180" x2="475" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="405" y1="220" x2="495" y2="180" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

    <!-- Panel 3 (Row 2) -->
    <polygon points="160,360 340,280 350,340 170,420" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Panel 4 (Row 2) -->
    <polygon points="360,270 540,190 550,250 370,330" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Spec Badge Overlay -->
  <rect x="30" y="30" width="220" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="50" y="59" fill="#f59e0b" font-family="'Inter', sans-serif" font-weight="800" font-size="16">⚡ 3 kW Rooftop Solar</text>
</svg>
