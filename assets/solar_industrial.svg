<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyInd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="panelInd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyInd)"/>

  <!-- Factory Industrial Roof Shed -->
  <polygon points="50,300 200,200 350,300 500,200 650,300 780,210 780,500 50,500" fill="#475569"/>

  <!-- Solar Arrays on Factory Shed -->
  <g fill="url(#panelInd)" stroke="#38bdf8" stroke-width="2">
    <!-- Array 1 -->
    <polygon points="70,290 190,210 230,270 110,350"/>
    <polygon points="220,200 340,120 380,180 260,260"/>

    <!-- Array 2 -->
    <polygon points="370,290 490,210 530,270 410,350"/>
    <polygon points="520,200 640,120 680,180 560,260"/>
  </g>

  <!-- Glowing Solar Power Lines -->
  <path d="M 100 400 L 300 400 L 500 450 L 700 450" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Spec Badge Overlay -->
  <rect x="30" y="30" width="250" height="46" rx="23" fill="rgba(15, 23, 42, 0.9)"/>
  <text x="50" y="59" fill="#10b981" font-family="'Inter', sans-serif" font-weight="800" font-size="16">🏭 50 kW Industrial Dairy Plant</text>
</svg>
