<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyComm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="panelComm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyComm)"/>

  <!-- Commercial Building Structure -->
  <rect x="80" y="220" width="640" height="280" fill="#334155"/>
  <rect x="60" y="200" width="680" height="20" fill="#475569"/>

  <!-- Glass Windows -->
  <g fill="#94a3b8" opacity="0.4">
    <rect x="120" y="260" width="80" height="180"/>
    <rect x="230" y="260" width="80" height="180"/>
    <rect x="340" y="260" width="80" height="180"/>
    <rect x="450" y="260" width="80" height="180"/>
    <rect x="560" y="260" width="80" height="180"/>
  </g>

  <!-- Large Commercial Solar Array Grid -->
  <g id="commPanels">
    <!-- Row 1 -->
    <polygon points="100,190 280,120 300,180 120,250" fill="url(#panelComm)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="310,110 490,40 510,100 330,170" fill="url(#panelComm)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="520,30 700,-40 720,20 540,90" fill="url(#panelComm)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Row 2 -->
    <polygon points="140,260 320,190 340,250 160,320" fill="url(#panelComm)" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="350,180 530,110 550,170 370,240" fill="url(#panelComm)" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="560,100 740,30 760,90 580,160" fill="url(#panelComm)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Spec Badge Overlay -->
  <rect x="30" y="30" width="240" height="46" rx="23" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="50" y="59" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="800" font-size="16">🏬 15 kW Commercial Plaza</text>
</svg>
