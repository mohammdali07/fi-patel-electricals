<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- TOP SOLAR ARTWORK (Sun & Panels) -->
  <g id="solarArtwork" transform="translate(195, 12)">
    <!-- Sun Rays radiating top-left -->
    <g stroke="#F58220" stroke-width="4.5" stroke-linecap="round">
      <line x1="28" y1="42" x2="12" y2="35"/>
      <line x1="42" y1="26" x2="30" y2="10"/>
      <line x1="65" y1="18" x2="62" y2="2"/>
      <line x1="90" y1="20" x2="98" y2="4"/>
      <line x1="110" y1="32" x2="124" y2="18"/>
      <line x1="126" y1="50" x2="142" y2="42"/>
    </g>

    <!-- Sun Arc Curve -->
    <path d="M 24 55 A 42 42 0 0 1 106 36" fill="none" stroke="#F58220" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Orange Solar Panel -->
    <polygon points="50,42 118,54 90,136 28,110" fill="#F58220" stroke="#1D1E38" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Grid Lines Left Panel -->
    <line x1="50" y1="42" x2="90" y2="136" stroke="#FFFFFF" stroke-width="2.2" opacity="0.9"/>
    <line x1="84" y1="48" x2="60" y2="123" stroke="#FFFFFF" stroke-width="2.2" opacity="0.9"/>
    <line x1="42" y1="68" x2="107" y2="87" stroke="#FFFFFF" stroke-width="2.2" opacity="0.9"/>
    <line x1="34" y1="90" x2="98" y2="112" stroke="#FFFFFF" stroke-width="2.2" opacity="0.9"/>

    <!-- Right Dark Navy Solar Panel -->
    <polygon points="118,54 186,64 154,142 90,136" fill="#1D1E38" stroke="#1D1E38" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Grid Lines Right Panel -->
    <line x1="152" y1="59" x2="122" y2="139" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="108" y1="78" x2="173" y2="90" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="101" y1="100" x2="165" y2="112" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="95" y1="120" x2="159" y2="130" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

    <!-- Central White Lightning Cutout -->
    <polygon points="102,42 78,86 96,86 80,126 112,78 94,78" fill="#FFFFFF" filter="url(#softGlow)"/>
  </g>

  <!-- ROOF BEAM & CHIMNEY PLUG -->
  <rect x="30" y="152" width="414" height="26" fill="#1D1E38"/>

  <!-- Chimney Plug Icon -->
  <g id="chimneyBox" fill="#1D1E38" transform="translate(435, 92)">
    <rect x="0" y="0" width="20" height="64" rx="2"/>
    <rect x="-4" y="-8" width="28" height="12" rx="2"/>
    <rect x="0" y="-18" width="5" height="12" rx="1"/>
    <rect x="15" y="-18" width="5" height="12" rx="1"/>
  </g>

  <!-- Large "F" in Dark Navy -->
  <rect x="30" y="152" width="46" height="125" fill="#1D1E38"/>
  <rect x="30" y="196" width="75" height="22" fill="#1D1E38"/>

  <!-- Stem of "i" in Dark Navy -->
  <rect x="118" y="206" width="34" height="71" fill="#1D1E38"/>

  <!-- Dot of "i" (Solar Badge) -->
  <g id="iDotCircle" transform="translate(135, 176)">
    <circle cx="0" cy="0" r="23" fill="#F58220"/>
    <line x1="-19" y1="-12" x2="19" y2="-12" stroke="#1D1E38" stroke-width="3"/>
    <line x1="-21" y1="-6" x2="21" y2="-6" stroke="#1D1E38" stroke-width="3"/>
    <line x1="-21" y1="6" x2="21" y2="6" stroke="#1D1E38" stroke-width="3"/>
    <line x1="-19" y1="12" x2="19" y2="12" stroke="#1D1E38" stroke-width="3"/>
    <polygon points="-3,-16 7,-2 0,-2 9,16 -2,2 4,2" fill="#FFFFFF"/>
  </g>

  <!-- Word "patel" in Bold Solar Orange -->
  <text x="168" y="254" fill="#F58220" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="82" letter-spacing="-1">patel</text>

  <!-- Word "ELECTRICALS" in Dark Navy -->
  <text x="194" y="286" fill="#1D1E38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="23" letter-spacing="6.5">ELECTRICALS</text>

</svg>
